<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Notas de Reuniones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-primary text-white text-center p-3">
        <h1>Gestor de Notas de Reuniones</h1>
    </header>

    <main class="container mt-4">
        <section id="form-section" class="mb-4">
            <button class="btn btn-primary mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#note-form-collapse" aria-expanded="false" aria-controls="note-form-collapse">
                <i class="bi bi-plus-lg"></i> Nueva Nota
            </button>
            <div class="collapse" id="note-form-collapse">
                <div class="card card-body">
                    <form id="note-form">
                        <input type="hidden" id="note-id">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="meeting-title" class="form-label">Título de la Reunión</label>
                                <input type="text" class="form-control" id="meeting-title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="meeting-date" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="meeting-date" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="participants" class="form-label">Participantes (separados por comas)</label>
                            <input type="text" class="form-control" id="participants" required>
                        </div>
                        <div class="mb-3">
                            <label for="meeting-type" class="form-label">Tipo de Reunión</label>
                            <select class="form-select" id="meeting-type">
                                <option value="Presencial">Presencial</option>
                                <option value="Virtual">Virtual</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="topics" class="form-label">Temas Tratados</label>
                            <textarea class="form-control" id="topics" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="agreements" class="form-label">Acuerdos</label>
                            <textarea class="form-control" id="agreements" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="pending-tasks" class="form-label">Tareas Pendientes</label>
                            <textarea class="form-control" id="pending-tasks" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="observations" class="form-label">Observaciones Adicionales</label>
                            <textarea class="form-control" id="observations" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Guardar Nota</button>
                        <button type="button" class="btn btn-secondary" id="cancel-edit">Cancelar</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="search-section" class="mb-4">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="search-input" placeholder="Buscar por título, fecha o participantes...">
            </div>
        </section>

        <section id="notes-list" class="row">
            <!-- Las notas se insertarán aquí -->
        </section>
    </main>

    <footer class="text-center p-3 mt-4 bg-light">
        <p>&copy; 2024 Gestor de Notas. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
